<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Batalkan OTP Transaksi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f7f7f7;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-align: center;
    }
    .btn-cancel {
      background-color: #dc3545;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn-cancel:hover {
      background-color: #b02a37;
    }
    .info {
      margin-bottom: 20px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verifikasi OTP Transaksi</h2>
    <div class="info">
      Silakan masukkan kode OTP yang telah dikirim ke nomor Anda.<br>
      Jika ingin membatalkan transaksi, klik tombol di bawah ini.
    </div>
    <input type="text" placeholder="Masukkan OTP" maxlength="6" style="padding:8px;font-size:16px;width:70%;margin-bottom:20px;">
    <br>
    <button class="btn-cancel" onclick="batalkanTransaksi()">Batalkan OTP / Transaksi</button>
  </div>
  <script>
    function batalkanTransaksi() {
      if(confirm('Apakah Anda yakin ingin membatalkan transaksi?')) {
        // Simulasi redirect atau aksi batalkan transaksi
        alert('Transaksi berhasil dibatalkan.');
        // window.location.href = '/halaman-setelah-batal'; // Redirect jika perlu
      }
    }
  </script>
</body>
</html>
